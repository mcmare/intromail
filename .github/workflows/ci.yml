name: IntroMail CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout IntroMail
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test greeting logic
        run: npm test
      - name: Test installer
        run: python3 -m unittest discover -s tests -p 'test_install.py'
      - name: Checkout current MailFlow sources
        uses: actions/checkout@v4
        with:
          repository: maathimself/mailflow
          path: upstream
      - name: Check integration points against upstream
        run: |
          python3 scripts/install.py upstream --dry-run
          python3 scripts/install.py upstream
          python3 scripts/install.py upstream --dry-run
